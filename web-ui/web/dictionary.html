<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lexify Kamus — Cari kata Bahasa Inggris dan Indonesia">
  <title>Lexify — Kamus</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<canvas id="particles-canvas"></canvas>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <img src="assets/raven.png" alt="Lexify"> Lexify
  </a>
  <ul class="nav-links">
    <li><a href="index.html">🏠 Home</a></li>
    <li><a href="dictionary.html">📖 Dictionary</a></li>
    <li><a href="quiz.html">🎯 Quiz</a></li>
    <li><a href="profile.html">👤 Profile</a></li>
  </ul>
  <div class="nav-stats">
    <div class="nav-stat">🔥 <span class="streak-display">0</span></div>
    <div class="nav-stat">⭐ <span class="xp-display">0</span></div>
  </div>
</nav>

<!-- MAIN -->
<div class="main-content">
  <div class="container">

    <h1 class="animate-in" style="font-size:1.8rem;margin-bottom:8px;">📖 Kamus</h1>
    <p class="animate-in" style="color:var(--text-secondary);margin-bottom:24px;">Cari kata Bahasa Inggris atau Indonesia untuk mempelajari artinya</p>

    <!-- SEARCH BAR -->
    <div class="search-wrapper animate-in animate-in-delay-1">
      <span class="search-icon">🔍</span>
      <input type="text" class="input input-lg search-input" id="search-input"
        placeholder="Ketik kata Bahasa Inggris atau Indonesia..." autocomplete="off">
      <div class="suggestions-dropdown"></div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:24px;" class="animate-in animate-in-delay-1">
      <button class="btn btn-primary" id="search-btn">Cari</button>
      <button class="btn btn-outline" id="lang-toggle" title="Cari Bahasa Inggris &rarr; Indonesia">🇬🇧 Inggris</button>
    </div>

    <!-- RESULTS -->
    <div id="result-area" class="animate-in animate-in-delay-2"></div>

    <!-- SEARCH HISTORY -->
    <div class="card card-static animate-in animate-in-delay-3" style="margin-top:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="section-title" style="margin:0;">🕐 Riwayat Pencarian</div>
        <button class="btn btn-sm btn-outline" id="clear-history-btn">Hapus</button>
      </div>
      <div id="history-list" style="margin-top:12px;"></div>
    </div>

    <!-- SAVED FAVORITES -->
    <div class="card card-static animate-in animate-in-delay-3" style="margin-top:24px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="section-title" style="margin:0;">❤️ Kata Favorit</div>
        <button class="btn btn-sm btn-outline" id="clear-favorites-btn">Hapus Semua</button>
      </div>
      <div id="favorites-list" style="margin-top:12px; display:flex; flex-wrap:wrap; gap:8px;"></div>
    </div>

  </div>
</div>

<script src="js/app.js"></script>
<script src="js/dictionary.js"></script>

</body>
</html>
